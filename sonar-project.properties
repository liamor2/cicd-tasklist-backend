sonar.projectKey=liam-tasklist-backend
sonar.projectName=cicd-tasklist-backend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.test.ts

sonar.exclusions=dist/**,node_modules/**,coverage/**,reports/**,.scannerwork/**
sonar.coverage.exclusions=src/__tests__/**,src/server.ts

sonar.javascript.lcov.reportPaths=coverage/unit.lcov.info,coverage/e2e.lcov.info
